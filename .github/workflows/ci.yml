name: CI

# "Kiểm chứng bằng chạy thật" thành cổng tự động:
#   - unit:     test thuần (node:test), không cần stack — phản hồi nhanh.
#   - e2e:      dựng toàn bộ stack Docker rồi chạy mọi e2e + bất biến (cổng chính).
#   - mutation: gỡ từng lớp phòng thủ → e2e phải chuyển đỏ. Rất chậm (restart service
#               nhiều lần) nên CHỈ chạy nightly hoặc bấm tay, không chặn mỗi push.

# ── NGÂN SÁCH PHÚT ACTIONS ────────────────────────────────────────────────────
# Repo PRIVATE ⇒ GitHub Free cho 2.000 phút/tháng. Ngày 2026-07-28 quota CHÁY, mọi job
# ngừng khởi động ("The job was not started because ... spending limit"), tức là mất
# TOÀN BỘ lưới an toàn — tệ hơn cả CI đỏ, vì CI đỏ ít ra còn chạy.
# Phép cộng của cấu hình cũ:
#   - lịch chạy MỖI ĐÊM, mỗi lần ~1h15m  ⇒ ~3.500 phút/tháng — MỘT MÌNH nó đã gấp 1,75
#     lần cả quota, trước khi tính bất kỳ lần push nào;
#   - mỗi push chạy trọn 80 bộ e2e ~45 phút (trước khi đổi sang glob chỉ 19 phút).
# Cấu hình mới, ước tính ~1.100 phút/tháng:
#   - push  → CHỈ job `unit` (~2 phút, không cần docker). Rẻ mà vẫn bắt được đúng thứ
#     đã lọt suốt nhiều ngày: CVE trong dependency + unit test vỡ;
#   - thứ 2/4/6 → e2e đầy đủ (45' × 13 ≈ 585 phút);
#   - chủ nhật → mutation (75' × 4 ≈ 300 phút);
#   - bấm tay bất cứ lúc nào — VÀ ĐÂY LÀ ĐIỀU BẮT BUỘC TRƯỚC MỖI LẦN DEPLOY.
# Không mất gì ở máy: `bash scripts/ci-local.sh` chạy ĐÚNG chừng đó, miễn phí, không
# tốn phút nào. CI giữ vai trò riêng của nó — kiểm trên MÁY SẠCH.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "Phạm vi chạy tay"
        type: choice
        default: e2e
        options: [e2e, mutation]
  schedule:
    - cron: "0 18 * * 1,3,5"   # 01:00 giờ VN thứ 2/4/6 — e2e đầy đủ
    - cron: "0 19 * * 0"       # 02:00 giờ VN chủ nhật — mutation

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (thuần, không cần stack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Mọi module test này chỉ dùng node builtins → không cần npm install.
      - name: Chạy unit test
        run: |
          shopt -s nullglob
          # "rỗng = xanh giả" — chốt theo TỪNG NGUỒN, không chỉ tổng:
          #  - mỗi thư mục test PHẢI còn ≥1 file (đổi tên/di chuyển cả dir → glob về 0 → FAIL).
          #    Guard cũ "-ge 4" là TỔNG 4 mẫu nên mất trọn dir packages/auth/test vẫn đủ 4 → xanh giả.
          #  - file lẻ (nullglob KHÔNG rút vì không có ký tự glob) PHẢI thực sự tồn tại → test -f.
          #  - tổng ≥ số thật hôm nay (7) để mất-ròng dù 1 file cũng đỏ.
          for d in packages/auth/test apps/tls-authorize/test; do
            g=("$d"/*.test.js)
            [ "${#g[@]}" -ge 1 ] || { echo "thiếu unit test trong $d/ (đổi tên/di chuyển?)"; exit 1; }
          done
          for f in apps/checkout/test/vietqr.test.js apps/seller/test/rbac.test.js packages/net-guard/test/fetch-image.test.js; do
            [ -f "$f" ] || { echo "thiếu unit test $f"; exit 1; }
          done
          files=(packages/auth/test/*.test.js apps/tls-authorize/test/*.test.js \
                 apps/checkout/test/vietqr.test.js apps/seller/test/rbac.test.js packages/net-guard/test/fetch-image.test.js)
          [ "${#files[@]}" -ge 8 ] || { echo "chỉ thấy ${#files[@]} unit test (<8) — nghi mất file"; exit 1; }
          node --test "${files[@]}"

      # Quét bảo mật TĨNH ở MỌI commit (dependency/secret/PII/pattern). Fail nếu có phát hiện.
      - name: Quét bảo mật tĩnh (security-scan)
        run: bash scripts/security-scan.sh

  e2e:
    name: E2E (docker stack)
    # KHÔNG chạy ở mỗi push nữa (xem ngân sách phút ở đầu file). Chạy thứ 2/4/6 và mỗi
    # khi bấm tay. TRƯỚC KHI DEPLOY phải bấm tay một lần và chờ xanh.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'e2e') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * 1,3,5')
    runs-on: ubuntu-latest
    # 45' là trần của thời danh-sách-tay 30 bộ. Glob chạy 80 bộ (mỗi bộ còn flushall
    # Redis trước khi chạy) nên phải nới, không thì CI chết vì hết giờ chứ không vì lỗi.
    timeout-minutes: 120
    env:
      C: "docker compose -f infra/compose.dev.yml"
    steps:
      - uses: actions/checkout@v4

      # up -d tôn trọng depends_on (service_healthy + migrate completed) nên khi
      # lệnh trả về là stack đã sẵn sàng; bước chờ bên dưới là phòng thủ thêm.
      - name: Build & khởi động stack
        run: $C up -d --build

      - name: Chờ services healthy + migrate xong
        run: |
          need="postgres redis minio mailpit auth platform seller seller-admin checkout payment worker storefront caddy"
          ok=0
          for _ in $(seq 1 72); do
            bad=""
            for s in $need; do
              h=$($C ps "$s" --format '{{.Health}}' 2>/dev/null || echo missing)
              [ "$h" = "healthy" ] || bad="$bad $s=$h"
            done
            dr=$($C ps dbtest --format '{{.State}}' 2>/dev/null || echo missing)
            [ "$dr" = "running" ] || bad="$bad dbtest=$dr"
            if [ -z "$bad" ]; then ok=1; break; fi
            echo "chờ:$bad"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "TIMEOUT chờ services"; $C ps; exit 1; }
          $C exec -T postgres psql -U app_owner -d app -tAc "select count(*) from schema_migrations" >/dev/null \
            || { echo "migrate chưa chạy"; exit 1; }
          echo "stack sẵn sàng"

      - name: Chạy toàn bộ e2e + bất biến
        run: |
          fail=0
          run() {  # <container> <mô tả> <lệnh...>
            local cont="$1" desc="$2"; shift 2
            $C exec -T redis redis-cli flushall >/dev/null 2>&1 || true
            echo "::group::$desc"
            if $C exec -T "$cont" "$@"; then echo "PASS  $desc"; else echo "FAIL  $desc"; fail=1; fi
            echo "::endgroup::"
          }
          # Glob test/*.test.js trong dbtest (3 suite: tenant-isolation, storefront-isolation,
          # schema-invariants). Chốt ≥3 TRƯỚC khi chạy: mất-ròng 1 suite (vd storefront-isolation
          # — KHÔNG verify-*.sh nào phủ) sẽ đỏ, không chạy phần còn lại rồi báo xanh giả.
          run dbtest "cô lập tenant + bất biến schema"  sh -c 'n=$(ls test/*.test.js 2>/dev/null | wc -l); [ "$n" -ge 3 ] || { echo "chỉ $n db test (<3) — nghi mất file"; exit 1; }; node --test test/*.test.js'
          # ── E2E lấy bằng GLOB, KHÔNG liệt kê tay ────────────────────────────────
          # Vì sao đổi: danh sách tay chỉ chạy 30/80 bộ có trên đĩa. 50 bộ ngoài danh
          # sách (sửa đơn, RMA, đối soát COD, tách vận đơn, điểm thưởng, khuyến mãi,
          # đua giỏ, QR guard, signup, GPS ship…) KHÔNG BAO GIỜ chạy — shipping.e2e
          # hỏng 9 ca nhiều ngày mà CI vẫn xanh. Ai thêm file *.e2e.mjs cũng phải nhớ
          # sửa file này là điều KHÔNG bao giờ xảy ra ⇒ để glob tự lấy.
          shopt -s nullglob
          suites=(apps/*/test/*.e2e.mjs apps/*/test/e2e.mjs)
          # "rỗng = xanh giả" (cùng kỷ luật bước unit test): mất-ròng dù 1 file cũng ĐỎ.
          # Xoá bộ test có chủ đích thì hạ số này trong CÙNG commit — buộc phải cố ý.
          MIN_E2E=80
          [ "${#suites[@]}" -ge "$MIN_E2E" ] || { echo "chỉ ${#suites[@]} bộ e2e (<$MIN_E2E) — nghi mất file"; exit 1; }
          echo "chạy ${#suites[@]} bộ e2e"
          for f in "${suites[@]}"; do
            # auth e2e chạy TRONG container auth (cần env/secret riêng của nó);
            # mọi bộ khác chạy trong dbtest và gọi service qua HTTP nội mạng.
            cont=dbtest
            case "$f" in apps/auth/test/e2e.mjs) cont=auth ;; esac
            run "$cont" "$f" node "$f"
          done
          [ "$fail" = 0 ] && echo "=== TẤT CẢ E2E XANH ===" || echo "=== CÓ SUITE ĐỎ ==="
          exit $fail

      # Routing QUA EDGE (Caddy) — không gọi service nội bộ. Đóng P0-1: webhook +
      # admin + storefront/checkout tới đúng service qua edge.
      - name: Smoke edge (routing qua Caddy)
        run: bash scripts/smoke-edge.sh

      # A2: mọi service trả /livez + /readyz + /healthz = 200 khi khoẻ.
      - name: Smoke readiness/liveness
        run: bash scripts/smoke-readiness.sh

      # On-demand TLS: chứng minh cơ chế TỪ CHỐI (domain chưa verified → không cấp cert),
      # chống flood, phục vụ cert đã cache khi DB chết. Chạy trong container toolbox.
      - name: Smoke TLS (Caddy on-demand + ask)
        run: bash scripts/smoke-tls.sh

      - name: Log services khi lỗi
        if: failure()
        run: $C logs --no-color --tail 200

      - name: Dọn stack
        if: always()
        run: $C down -v

  mutation:
    name: Mutation (nightly / manual)
    # Đắt nhất (~75 phút) và ít gấp nhất ⇒ hạ từ MỖI ĐÊM xuống MỖI TUẦN.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.scope == 'mutation') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 19 * * 0')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      C: "docker compose -f infra/compose.dev.yml"
    steps:
      - uses: actions/checkout@v4

      - name: Build & khởi động stack
        run: $C up -d --build

      - name: Chờ services healthy
        run: |
          need="postgres redis minio mailpit auth platform seller seller-admin checkout payment worker storefront caddy"
          ok=0
          for _ in $(seq 1 72); do
            bad=""
            for s in $need; do
              h=$($C ps "$s" --format '{{.Health}}' 2>/dev/null || echo missing)
              [ "$h" = "healthy" ] || bad="$bad $s=$h"
            done
            if [ -z "$bad" ]; then ok=1; break; fi
            echo "chờ:$bad"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "TIMEOUT"; $C ps; exit 1; }

      # Khẳng định chống-flood của smoke-tls chạy Ở ĐÂY, không ở job e2e chặn mỗi push.
      # Nó đỏ trên runner GitHub qua 5 vòng liên tiếp trong khi cơ chế KHÔNG hỏng (máy dev
      # chặn 359/400) và phép đo cuối xác nhận ngân sách trong container ĐÚNG là 2/s — tức
      # còn một cơ chế chưa hiểu. Chưa hiểu thì không giả vờ đã hiểu, nhưng cũng không để
      # nó giữ CI làm con tin: CI đỏ triền miên chính là thứ đã khiến một CVE trong sharp
      # sống nhiều ngày mà không ai nhìn. Ở đây nó vẫn chạy mỗi đêm để còn dữ liệu mà mổ.
      # `|| true`: job này là để QUAN SÁT, một khẳng định chưa hiểu không được làm đỏ cả
      # vòng mutation. Kết quả vẫn nằm nguyên trong log.
      - name: Smoke TLS — khẳng định chống flood (quan sát, không chặn)
        run: SMOKE_TLS_FLOOD=1 bash scripts/smoke-tls.sh || true

      # Gỡ từng lớp phòng thủ → e2e phải chuyển đỏ; script tự hoàn nguyên (trap).
      # GLOB mọi verify-*.sh (không hardcode danh sách → thêm script mới TỰ chạy, không trôi
      # sót media/checkout/platform như trước). "rỗng = xanh giả": nếu tìm được quá ít script
      # (đổi tên/di chuyển) → FAIL thay vì lặp 0 lần rồi báo xanh.
      - name: Mutation testing (full — mọi verify-*.sh)
        run: |
          shopt -s nullglob
          scripts=(scripts/verify-*.sh)
          echo "Tìm thấy ${#scripts[@]} verify script"
          # Sàn = SỐ THẬT hôm nay (20, gồm verify-backup-encryption), không để hở: sàn thấp cho
          # mất-ròng script mutation mà vẫn qua. Thêm script mới → đếm tăng, vẫn qua; xoá/đổi tên → đếm giảm <20 → FAIL.
          [ "${#scripts[@]}" -ge 20 ] || { echo "CHỈ ${#scripts[@]} verify script (<20) — nghi mất script (rỗng=xanh giả)"; exit 1; }
          fail=0
          for s in "${scripts[@]}"; do
            name=$(basename "$s" .sh)
            echo "::group::$name"
            if bash "$s"; then echo "PASS  $name"; else echo "FAIL  $name"; fail=1; fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Dọn stack
        if: always()
        run: $C down -v
