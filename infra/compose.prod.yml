# Stack PRODUCTION. Khác compose.dev.yml ở các điểm CỐT LÕI:
#   - Secret lấy từ .env (${VAR:?} → fail nếu thiếu), KHÔNG hardcode devpassword.
#   - KHÔNG bind-mount src/test (code đã COPY vào image; npm ci + node pin digest — P0-7).
#   - CHỈ Caddy mở cổng ra Internet (80/443); mọi service khác chỉ trong mạng nội bộ.
#   - migrate chạy `up` KHÔNG seed (seed là dev-only).
#   - Postgres bật WAL archiving cho PITR (P0-8).
#   - Worker gửi email qua SMTP relay THẬT (không Mailpit).
#   - Giới hạn RAM + log để một VPS không bị một service ăn hết.
#   - KHÔNG có dbtest/toolbox/mailpit.
#
# Triển khai QUA scripts/deploy.sh (nó sắp thứ tự migrate → provision-db-roles → up).
# Xem docs/22 (secret/build) + docs/23 (deploy/backup).

name: nentang-prod

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    build:
      context: ./caddy          # Dockerfile có plugin caddy-dns/cloudflare (DNS-01 wildcard)
    restart: unless-stopped
    <<: *logging
    ports:
      - "80:80"                  # HTTP-01 cho domain khách + redirect 308
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      CF_API_TOKEN: ${CF_API_TOKEN:?}   # chỉ Zone:DNS:Edit trên nentang.vn
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # CHỨNG CHỈ + ACME account — PHẢI backup (backup.sh)
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 192m } } }
    depends_on:
      tls-authorize: { condition: service_healthy }
      storefront:    { condition: service_healthy }

  # Volume WAL mới thuộc root; archive_command chạy dưới tiến trình postgres (uid 70)
  # nên phải chown trước, nếu không WAL archiving im lặng thất bại (đã lộ ở pitr-drill).
  wal-init:
    image: postgres:16-alpine
    <<: *logging
    command: sh -c "chown -R postgres:postgres /wal-archive"
    volumes:
      - walarchive:/wal-archive
    restart: "no"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    depends_on:
      wal-init: { condition: service_completed_successfully }
    # WAL archiving cho PITR: mỗi WAL segment được copy sang /wal-archive (volume),
    # backup.sh đẩy offsite thường xuyên → RPO nhỏ. archive_command idempotent, không đè.
    # archive_timeout: ép chuyển+archive WAL ít nhất mỗi 5 phút NGAY CẢ khi shop ít giao
    # dịch (không thì segment 16MB lâu mới đầy → WAL đang mở không được ship → RPO vô hạn).
    command: >
      postgres
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /wal-archive/%f && cp %p /wal-archive/%f'
      -c archive_timeout=300
      -c max_wal_senders=3
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_owner -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 1g } } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *logging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 320m } } }

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    <<: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 512m } } }

  # One-shot: chạy migration (KHÔNG seed). deploy.sh gọi qua `run --rm`.
  migrate:
    build: { context: ../packages/db }
    <<: *logging
    command: ["node", "migrate.js", "up"]
    environment:
      DATABASE_URL_OWNER: postgres://app_owner:${POSTGRES_PASSWORD:?}@postgres:5432/app
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  tls-authorize:
    build: { context: ../apps/tls-authorize }
    restart: unless-stopped
    <<: *logging
    environment:
      DATABASE_URL: postgres://app_tls:${APP_TLS_PASSWORD:?}@postgres:5432/app
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-nentang.vn}
      PORT: "3010"
    deploy: { resources: { limits: { memory: 128m } } }
    depends_on:
      postgres: { condition: service_healthy }

  auth:
    build: { context: .., dockerfile: apps/auth/Dockerfile }
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production           # chặn cờ dev (DEV_RESET_TOKEN_STASH) khởi động
      DATABASE_URL: postgres://app_auth:${APP_AUTH_PASSWORD:?}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      MFA_ENC_KEY: ${MFA_ENC_KEY:?}
      SESSION_TTL_HOURS: "168"
      ALLOWED_ORIGINS: https://${ADMIN_DOMAIN:-admin.nentang.vn}
      PORT: "3020"
      # Trang /reset CÔNG KHAI của admin — auth dựng link trong email đặt lại mật khẩu.
      RESET_LINK_BASE: https://${ADMIN_DOMAIN:-admin.nentang.vn}/reset
    deploy: { resources: { limits: { memory: 256m } } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  platform:
    build: { context: ../apps/platform }
    restart: unless-stopped
    <<: *logging
    environment:
      # Đối chiếu cấu hình thu tiền trên màn hình console (0128) — số tài khoản ở env.
      PLATFORM_BANK_BIN: ${PLATFORM_BANK_BIN:-}
      PLATFORM_BANK_ACCOUNT: ${PLATFORM_BANK_ACCOUNT:-}
      PLATFORM_BANK_NAME: ${PLATFORM_BANK_NAME:-}
      APP_ENV: production
      DATABASE_URL: postgres://app_platform:${APP_PLATFORM_PASSWORD:?}@postgres:5432/app
      AUTH_URL: http://auth:3020
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-nentang.vn}
      ALLOWED_ORIGINS: https://${ADMIN_DOMAIN:-admin.nentang.vn}
      PORT: "3030"
      # Số ngày dùng thử khi tạo shop (0 = không trial). Đồng bộ .env.example + 0056.
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      # Link chấp nhận lời mời trong EMAIL (mirror RESET_LINK_BASE của auth).
      INVITE_LINK_BASE: https://${ADMIN_DOMAIN:-admin.nentang.vn}/invite/accept
    deploy: { resources: { limits: { memory: 192m } } }
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }

  seller:
    build: { context: ../apps/seller }
    volumes:
      # Hàng rào SSRF dùng chung (image không có packages/) — import '../fetch-image.js'.
      # CÙNG MỘT BẢN với service kia: nhân bản đường ống bảo mật là kiểu trùng lặp chắc
      # chắn trôi lệch — vá một bên, quên bên kia.
      - ../packages/net-guard/src/fetch-image.js:/app/fetch-image.js:ro
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_rw:${APP_RW_PASSWORD:?}@postgres:5432/app
      AUTH_URL: http://auth:3020
      ALLOWED_ORIGINS: https://${ADMIN_DOMAIN:-admin.nentang.vn}
      PORT: "3040"
      # Link chấp nhận lời mời trong EMAIL (mirror RESET_LINK_BASE của auth).
      INVITE_LINK_BASE: https://${ADMIN_DOMAIN:-admin.nentang.vn}/invite/accept
      # Custom domain (A5): chặn khách chiếm subdomain nền tảng.
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-nentang.vn}
      # IP CÔNG KHAI khách trỏ bản ghi A về — PHẢI là floating IP (ADR-004), không phải
      # IP tạm của máy. Trống thì màn hình Tên miền không hiện được IP và khách buộc
      # phải hỏi hỗ trợ; nên :? để deploy fail-loud thay vì lặng lẽ thiếu.
      PLATFORM_IP: ${PLATFORM_IP:?}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      MEDIA_BUCKET_PRIVATE: media-private
      MEDIA_BUCKET_PUBLIC: media-public
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:?}   # vd https://cdn.nentang.vn/media-public
      # Vận chuyển hãng (GHN/GHTK): khoá mã hoá token per-shop (BẮT BUỘC nếu dùng);
      # API base mặc định trỏ hãng THẬT — không đặt lại trừ khi test.
      SHIPPING_ENC_KEY: ${SHIPPING_ENC_KEY:?}
      # Mã hoá Page Access Token khi chủ shop kết nối Trang Facebook (0122).
      MESSENGER_ENC_KEY: ${MESSENGER_ENC_KEY:?}
      # Telegram bot username (công khai) để dựng deep-link kết nối per-shop.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    deploy: { resources: { limits: { memory: 384m } } }   # sharp re-encode ảnh
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      auth: { condition: service_healthy }

  checkout:
    build: { context: ../apps/checkout }
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_checkout:${APP_CHECKOUT_PASSWORD:?}@postgres:5432/app
      SHIP_FEE_VND: ${SHIP_FEE_VND:-30000}
      # Chống đơn ảo: trần đơn CHƯA xử lý theo nguồn (hash IP) + theo SĐT khi đặt.
      MAX_PENDING_ORDERS_PER_IP: ${MAX_PENDING_ORDERS_PER_IP:-30}
      MAX_PENDING_ORDERS_PER_PHONE: ${MAX_PENDING_ORDERS_PER_PHONE:-8}
      ORDER_HASH_PEPPER: ${ORDER_HASH_PEPPER:?}   # PEPPER băm IP khách (HMAC) — bắt buộc ở prod
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:?}   # ảnh thumbnail trong giỏ (img-src CSP)
      REDIS_URL: redis://redis:6379               # rate-limit per-IP (Đợt 6.2); vắng → gate tự tắt (fail-open)
      CHECKOUT_RL_PER_MIN: ${CHECKOUT_RL_PER_MIN:-120}
      PORT: "3060"
    volumes:
      # Bộ đếm rate-limit DÙNG CHUNG với auth. Image build từ context ../apps/checkout nên
      # KHÔNG có packages/ — mount file vào /app/ratelimit.js để `import '../ratelimit.js'`
      # giải được. Thiếu mount → service fail healthcheck lúc khởi động (Caddy không route
      # tới upstream unhealthy) → deploy fail AN TOÀN, không phục vụ bản vỡ. RO.
      - ../packages/auth/src/ratelimit.js:/app/ratelimit.js:ro
    deploy: { resources: { limits: { memory: 192m } } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  payment:
    build: { context: ../apps/payment }
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_payment:${APP_PAYMENT_PASSWORD:?}@postgres:5432/app
      SEPAY_WEBHOOK_KEY: ${SEPAY_WEBHOOK_KEY:?}
      REDIS_URL: redis://redis:6379               # rate-limit webhook per-IP (Đợt 6.2); vắng → fail-open
      SEPAY_WEBHOOK_RL_PER_MIN: ${SEPAY_WEBHOOK_RL_PER_MIN:-120}
      PORT: "3070"
    volumes:
      # Xem chú thích checkout: mount bộ đếm rate-limit dùng chung (image không có packages/).
      - ../packages/auth/src/ratelimit.js:/app/ratelimit.js:ro
    deploy: { resources: { limits: { memory: 160m } } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Bot Messenger (0122): khách chốt đơn ngay trong chat Facebook. Vai app_messenger
  # least-priv — CHỈ 2 bảng của riêng nó; tạo đơn đi qua HTTP /ingest/orders của seller.
  messenger:
    build: { context: ../apps/messenger }
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_messenger:${APP_MESSENGER_PASSWORD:?}@postgres:5432/app
      # App Secret của Meta App do NỀN TẢNG sở hữu (một app cho mọi shop). Thiếu → mọi
      # webhook bị 403, có log cảnh báo lúc khởi động chứ không im lặng.
      MESSENGER_APP_SECRET: ${MESSENGER_APP_SECRET:?}
      # PHẢI khớp MESSENGER_ENC_KEY của service seller — nếu không, token Trang mà seller
      # mã hoá thì messenger không mở được, và lỗi chỉ lộ ra lúc khách nhắn tin thật.
      MESSENGER_ENC_KEY: ${MESSENGER_ENC_KEY:?}
      SELLER_URL: http://seller:3040
      SHOP_LOOKUP_BASE: ${SHOP_LOOKUP_BASE:-}
      PORT: "3072"
    deploy: { resources: { limits: { memory: 200m } } }
    depends_on:
      postgres: { condition: service_healthy }

  # Self-serve signup (0091): tự đăng ký shop công khai (nentang.vn/signup*). Vai app_signup least-priv.
  # Build context = repo root (Dockerfile COPY packages/auth/src) → KHÔNG cần mount như checkout/payment.
  signup:
    build: { context: .., dockerfile: apps/signup/Dockerfile }
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_signup:${APP_SIGNUP_PASSWORD:?}@postgres:5432/app
      REDIS_URL: redis://redis:6379              # rate-limit + advisory-lock DB là sàn (fail-open Redis)
      PORT: "3064"
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-nentang.vn}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      IP_PEPPER: ${ORDER_HASH_PEPPER:?}          # dùng chung PEPPER băm IP (HMAC) — bắt buộc ở prod
      SIGNUP_FORM_SECRET: ${SIGNUP_FORM_SECRET:?} # HMAC form-ts chống bot POST-thẳng + timing
    deploy: { resources: { limits: { memory: 160m } } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Tài khoản khách storefront (0083): mount /account/* trên host shop (Caddy đã route @account →
  # cả *.nentang.vn lẫn tên miền riêng). Vai app_customer least-priv. Build repo-root (COPY packages/auth).
  account:
    build: { context: .., dockerfile: apps/account/Dockerfile }
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_customer:${APP_CUSTOMER_PASSWORD:?}@postgres:5432/app
      REDIS_URL: redis://redis:6379              # rate-limit login/đăng-ký khách (fail-open — Argon2 là sàn)
      PORT: "3062"
      CUST_SESSION_TTL_HOURS: ${CUST_SESSION_TTL_HOURS:-720}
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:?}   # ảnh SP trong lịch sử đơn (img-src CSP)
    deploy: { resources: { limits: { memory: 160m } } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ../apps/worker }
    volumes:
      # Hàng rào SSRF dùng chung (image không có packages/) — import '../fetch-image.js'.
      # CÙNG MỘT BẢN với service kia: nhân bản đường ống bảo mật là kiểu trùng lặp chắc
      # chắn trôi lệch — vá một bên, quên bên kia.
      - ../packages/net-guard/src/fetch-image.js:/app/fetch-image.js:ro
      # Bộ vẽ banner mặc định (0114) — import '../banner-art.js'. Cùng lối mount.
      - ../packages/banner-art/src/index.js:/app/banner-art.js:ro
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_worker:${APP_WORKER_PASSWORD:?}@postgres:5432/app
      # Báo khách qua Messenger khi đơn đổi trạng thái (0122). Trống = tắt kênh này —
      # đơn chốt trong chat KHÔNG có email nên đây là kênh báo DUY NHẤT tới nhóm khách đó.
      MESSENGER_URL: ${MESSENGER_URL:-http://messenger:3072}
      DATABASE_URL_EXPIRY: postgres://app_expiry:${APP_EXPIRY_PASSWORD:?}@postgres:5432/app
      ORDER_EXPIRY_MINUTES: ${ORDER_EXPIRY_MINUTES:-30}
      COD_EXPIRY_DAYS: ${COD_EXPIRY_DAYS:-7}   # đơn COD chưa xác nhận quá N ngày → tự huỷ (chống đơn ảo)
      EXPIRY_SWEEP_MS: ${EXPIRY_SWEEP_MS:-60000}
      # Xác minh custom domain qua DNS TXT (A5). Prod dùng DNS hệ thống (KHÔNG đặt
      # DOMAINVERIFY_RESOLVER — đó chỉ cho stub e2e).
      DATABASE_URL_DOMAINVERIFY: postgres://app_domainverify:${APP_DOMAINVERIFY_PASSWORD:?}@postgres:5432/app
      DOMAINVERIFY_SWEEP_MS: ${DOMAINVERIFY_SWEEP_MS:-60000}
      # Khép kín vòng bill: quét thuê bao quá hạn → past_due → cancelled + đình chỉ shop.
      # (Bỏ dòng này = TẮT tự đình chỉ; team quản lý thuê bao tay qua Console.)
      DATABASE_URL_BILLING: postgres://app_billing:${APP_BILLING_PASSWORD:?}@postgres:5432/app
      # Ân hạn past_due (ngày). Trước đây prod KHÔNG truyền biến này (code luôn chạy mặc
      # định 7) — nhắc hạn tính grace_days_left từ nó nên PHẢI truyền qua để copy khớp
      # đúng thời điểm treo shop thật (đặt trong .env thì đổi cả hai cùng lúc).
      SUBSCRIPTION_GRACE_DAYS: ${SUBSCRIPTION_GRACE_DAYS:-7}
      # Self-serve signup (0091): pool app_signup GC nháp treo → giải phóng slug + gửi email verify.
      DATABASE_URL_SIGNUP: postgres://app_signup:${APP_SIGNUP_PASSWORD:?}@postgres:5432/app
      # Điểm thưởng (0086): worker sweep tích (vesting) + thu-hồi (clawback/reversal). Vai app_loyalty.
      DATABASE_URL_LOYALTY: postgres://app_loyalty:${APP_LOYALTY_PASSWORD:?}@postgres:5432/app
      DATABASE_URL_AFFILIATE: postgres://app_affiliate:${APP_AFFILIATE_PASSWORD:?}@postgres:5432/app
      LOYALTY_SWEEP_MS: ${LOYALTY_SWEEP_MS:-300000}
      SIGNUP_SWEEP_MS: ${SIGNUP_SWEEP_MS:-300000}
      # Thương hiệu + email liên hệ nền tảng trong email/Telegram NHẮC HẠN thuê bao.
      PLATFORM_BRAND: ${PLATFORM_BRAND:-Nền Tảng}
      PLATFORM_CONTACT_EMAIL: ${PLATFORM_CONTACT_EMAIL:-lienhe@nentang.vn}
      # Poll vận đơn hãng VC (0044): khoá PHẢI khớp seller; sweep mặc định 10 phút.
      SHIPPING_ENC_KEY: ${SHIPPING_ENC_KEY:?}
      TRACKING_SWEEP_MS: ${TRACKING_SWEEP_MS:-600000}
      # Cảnh báo đường tiền/vận hành → webhook (Slack/Discord/Telegram-bridge). Trống = tắt.
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      # Dead-man's switch: ping monitor NGOÀI (healthchecks.io) mỗi nhịp alert-sweep (~5').
      # Worker treo/chết/DB sập → ngừng ping → monitor báo động. Trống = tắt.
      WORKER_HEARTBEAT_URL: ${WORKER_HEARTBEAT_URL:-}
      # Bot Telegram nền tảng (thông báo per-shop + cảnh báo tiền). Trống = tắt.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-nentang.vn}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # SMTP relay THẬT (VPS VN thường bị chặn cổng 25 → phải dùng relay).
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      # (tuỳ chọn) ép TLS ngầm khi relay không dùng cổng 465 (465 tự bật trong code).
      SMTP_SECURE: ${SMTP_SECURE:-}
      EMAIL_FROM: ${EMAIL_FROM:?}
      POLL_MS: "1000"
      EMAIL_ATTEMPTS: "5"
      EMAIL_BACKOFF_MS: "2000"
      PORT: "3080"
    deploy: { resources: { limits: { memory: 256m } } }
    # Tường minh (đè HEALTHCHECK của image) để ops chỉnh không cần rebuild. LƯU Ý:
    # compose + restart:unless-stopped KHÔNG tự restart container `unhealthy` — chỉ
    # process THOÁT mới restart. Worker treo-nhưng-sống cần WORKER_HEARTBEAT_URL +
    # monitor NGOÀI (docs/35 Blocker 3).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  storefront:
    build: { context: ../apps/storefront }
    restart: unless-stopped
    <<: *logging
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://app_store:${APP_STORE_PASSWORD:?}@postgres:5432/app
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:?}
      # Trang CÔNG TY trên apex nentang.vn (landing + Giới thiệu/Hỗ trợ/Điều khoản/Blog).
      PLATFORM_ROOT_HOSTS: ${PLATFORM_ROOT_HOSTS:-nentang.vn,www.nentang.vn}
      PLATFORM_BRAND: ${PLATFORM_BRAND:-Nền Tảng}
      PLATFORM_CONTACT_EMAIL: ${PLATFORM_CONTACT_EMAIL:-lienhe@nentang.vn}
      PLATFORM_CONTACT_PHONE: ${PLATFORM_CONTACT_PHONE:-}
      REDIS_URL: redis://redis:6379               # rate-limit đọc/tìm-kiếm per-IP (Đợt 6.2); vắng → fail-open
      SF_READ_RL_PER_MIN: ${SF_READ_RL_PER_MIN:-240}
      SF_SEARCH_RL_PER_MIN: ${SF_SEARCH_RL_PER_MIN:-30}
      PORT: "3050"
    volumes:
      # Xem chú thích checkout: mount bộ đếm rate-limit dùng chung (image không có packages/).
      - ../packages/auth/src/ratelimit.js:/app/ratelimit.js:ro
      # Thư viện preset dùng chung (image không có packages/) — import '../presets.js'.
      - ../packages/presets/src/index.js:/app/presets.js:ro
    deploy: { resources: { limits: { memory: 256m } } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # admin.nentang.vn (Caddyfile) → seller-admin:3001. BFF SSR: cầm cookie phiên của
  # trình duyệt, gọi NỘI BỘ auth/seller/platform. Không đụng DB, không giữ secret DB.
  seller-admin:
    build: { context: ../apps/seller-admin }
    restart: unless-stopped
    <<: *logging
    environment:
      NODE_ENV: production
      AUTH_URL: http://auth:3020
      SELLER_URL: http://seller:3040
      PLATFORM_URL: http://platform:3030
      # Địa chỉ NHẬN ĐƠN từ phần mềm ngoài (0120) hiện trên trang Kết nối. Host webhook
      # riêng như SePay, không suy ra từ host admin.
      INGEST_URL: https://${HOOKS_DOMAIN:-hooks.nentang.vn}/ingest/orders
      # Origin admin gắn vào request nội bộ (backend originAllowed đòi Origin allowlist).
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:-admin.nentang.vn}
      # CSRF của chính admin: chỉ nhận POST từ Origin của mình.
      ALLOWED_ORIGINS: https://${ADMIN_DOMAIN:-admin.nentang.vn}
      # Ảnh SP phục vụ từ CDN → origin thêm vào CSP img-src; PHẢI khớp img-src ở Caddyfile.
      MEDIA_PUBLIC_BASE: ${MEDIA_PUBLIC_BASE:?}
      PORT: "3001"
    volumes:
      # Thư viện preset dùng chung (image không có packages/) — import '../presets.js'.
      - ../packages/presets/src/index.js:/app/presets.js:ro
    deploy: { resources: { limits: { memory: 160m } } }
    depends_on:
      auth: { condition: service_healthy }
      seller: { condition: service_healthy }
      platform: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
  walarchive:
  caddy_data:
  caddy_config:
  caddy_logs:
